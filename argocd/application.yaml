apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opsdesk
  namespace: argocd
  labels:
    app.kubernetes.io/name: opsdesk
    app.kubernetes.io/part-of: devsecops-csp
spec:
  project: default
  source:
    repoURL: https://github.com/Akarsh1196/devsecops-csp.git
    targetRevision: main
    path: helm/taskboard
    helm:
      valueFiles:
        - values-prod.yaml
      parameters:
        - name: backend.image
          value: 992163310601.dkr.ecr.ap-south-1.amazonaws.com/opsdesk-backend
        - name: frontend.image
          value: 992163310601.dkr.ecr.ap-south-1.amazonaws.com/opsdesk-frontend
        - name: backend.tag
          value: live-20261017
        - name: frontend.tag
          value: live-20261017-r2
        - name: postgres.storageClassName
          value: gp3
  destination:
    server: https://kubernetes.default.svc
    namespace: opsdesk
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
