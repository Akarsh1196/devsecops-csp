name: OpsDesk CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test:
    name: Test backend and frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Run backend tests
        run: pytest -q
        working-directory: backend

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: frontend

  build-scan-push:
    name: Build, scan, and publish images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build SHA-tagged images
        run: |
          owner="$(printf '%s' "$IMAGE_OWNER" | tr '[:upper:]' '[:lower:]')"
          backend_image="${REGISTRY}/${owner}/opsdesk-backend:${IMAGE_TAG}"
          frontend_image="${REGISTRY}/${owner}/opsdesk-frontend:${IMAGE_TAG}"
          echo "BACKEND_IMAGE=${backend_image}" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=${frontend_image}" >> "$GITHUB_ENV"
          docker build -t "$backend_image" ./backend
          docker build -t "$frontend_image" ./frontend

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg wget
          wget -qO- https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan backend image for HIGH and CRITICAL vulnerabilities
        run: trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$BACKEND_IMAGE"

      - name: Scan frontend image for HIGH and CRITICAL vulnerabilities
        run: trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$FRONTEND_IMAGE"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish SHA-tagged images
        if: github.event_name == 'push'
        run: |
          docker push "$BACKEND_IMAGE"
          docker push "$FRONTEND_IMAGE"

  deploy:
    name: Deploy with Helm
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - uses: azure/setup-kubectl@v4

      - name: Configure kubectl
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          test -n "$KUBE_CONFIG_DATA"
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG_DATA" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Bootstrap namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Deploy SHA-tagged images with Helm
        run: |
          owner="$(printf '%s' "$IMAGE_OWNER" | tr '[:upper:]' '[:lower:]')"
          helm upgrade --install opsdesk ./helm/taskboard \
            --namespace opsdesk \
            --create-namespace \
            --values ./helm/taskboard/values-prod.yaml \
            --set-string backend.image="${REGISTRY}/${owner}/opsdesk-backend" \
            --set-string backend.tag="$IMAGE_TAG" \
            --set-string frontend.image="${REGISTRY}/${owner}/opsdesk-frontend" \
            --set-string frontend.tag="$IMAGE_TAG" \
            --wait \
            --timeout 10m
