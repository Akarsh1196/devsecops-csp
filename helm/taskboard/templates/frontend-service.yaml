apiVersion: v1
kind: Service
metadata:
  name: {{ include "opsdesk.fullname" . }}-frontend
  labels:
    app: opsdesk-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: {{ include "opsdesk.name" . }}
spec:
  type: ClusterIP
  selector:
    app: opsdesk-frontend
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
